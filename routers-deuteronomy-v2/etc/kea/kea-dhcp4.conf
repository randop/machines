{
  "Dhcp4": {
    "hooks-libraries": [
      {
        "library": "/usr/lib/kea/hooks/libdhcp_mysql.so"
      }
    ],
    "interfaces-config": {
      "interfaces": [
        "bond0"
      ],
      "dhcp-socket-type": "raw"
    },
    "lease-database": {
      "type": "mysql",
      "name": "dbname",
      "user": "dbuser",
      "password": "dbpassword",
      "host": "localhost",
      "port": 3306
    },
    "subnet4": [
      {
	"id": 2,
        "allocator": "random",
        "subnet": "192.168.0.0/24",
        "pools": [ { "pool": "192.168.0.10 - 192.168.0.254" } ],
        "option-data": [
          {"name": "routers", "data": "192.168.0.1"},
          {"name": "domain-name-servers", "data": "8.8.8.8, 8.8.4.4"}
        ]
      },
      {
        "pools": [
          {
            "pool": "10.2.0.1-10.255.255.250"
          }
        ],
        "subnet": "10.0.0.0/8",
        "id": 1,
        "allocator": "random",
        "option-data": [
          {
            "name": "routers",
            "data": "10.0.0.1"
          },
          {
            "name": "domain-name-servers",
            "data": "10.0.0.1"
          }
        ],
        "reservations": [
          {
            "hw-address": "00:00:00:00:00:00",
            "ip-address": "10.1.1.1",
            "hostname": "randop.tindango"
          }
        ]
      }
    ],
    "loggers": [
      {
        "name": "*",
        "severity": "INFO"
      }
    ],
    "compatibility": {
      "exclude-first-last-24": true
    }
  }
}
