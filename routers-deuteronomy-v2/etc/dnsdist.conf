-- #=================================================================
-- # NXDOMAIN Rule:
-- # Important to handle ->>HEADER<<- opcode: QUERY, status: NXDOMAIN from downstream
-- #=================================================================
function nxDomainPolicy(dr)
	if dr.rcode == DNSRCode.NXDOMAIN and dr.pool ~= "restarted" then
		-- assign this query to a new pool
		dr.pool = "restarted"
		-- discard the received response and
		-- restart the processing of the query
		dr:restart()
		dr.rcode = DNSRCode.NOERROR
		return DNSResponseAction.Truncate
	end

	return DNSResponseAction.None
end

addResponseAction(AllRule(), LuaResponseAction(nxDomainPolicy))

function nxFallbackPolicy(dr)
	if dr.rcode == DNSRCode.NOERROR and dr.pool == "restarted" then
		dr:restart()
		dr.pool = "fallback"
		dr.rcode = DNSRCode.NOERROR
		dr:setTag("fallback", "fallback")
		return DNSResponseAction.None
	end

	return DNSResponseAction.None
end

addResponseAction(AllRule(), LuaResponseAction(nxFallbackPolicy))
-- #-----------------------------------------------------------------

-- #=================================================================
-- # Spoof Rule: Answer with 0.0.0.0 result
-- #=================================================================
-- # Workaround for missing feature:
-- # [dnsdist] Allows using SpoofAction in DNSResponse
-- # https://github.com/PowerDNS/pdns/issues/14821
function spoofPolicy(dr)
	dr:restart()
	dr:setTag("spoof", "spoof")
	-- build a raw DNS response packet:
	-- copy qname + qtype + qclass from the incoming query,
	-- then append an A RR answer with 0.0.0.0
	local qname = dr.qname:toDNSString() -- wire-format qname
	local packet =
		-- DNS header (12 bytes):
		--   ID: 2 bytes (will be overwritten by setContent)
		--   Flags: QR=1, AA=1, RD=1, RA=1 → 0x8580
		--   QDCOUNT=1, ANCOUNT=1, NSCOUNT=0, ARCOUNT=0
		"\000\000" -- ID placeholder (replaced by setContent)
		.. "\133\128" -- flags: 0x8580 (QR AA RD RA, NOERROR)
		.. "\000\001" -- QDCOUNT = 1
		.. "\000\001" -- ANCOUNT = 1
		.. "\000\000" -- NSCOUNT = 0
		.. "\000\000" -- ARCOUNT = 0
		-- Question section:
		.. qname -- wire-format qname
		.. "\000\001" -- QTYPE  = A
		.. "\000\001" -- QCLASS = IN
		-- Answer section:
		.. qname -- wire-format qname
		.. "\000\001" -- TYPE  = A
		.. "\000\001" -- CLASS = IN
		.. "\000\000\000\060" -- TTL = 60
		.. "\000\004" -- RDLENGTH = 4
		.. "\000\000\000\000" -- RDATA = 0.0.0.0

	dr:setContent(packet)
	return DNSResponseAction.Truncate
end

addResponseAction(TagRule("fallback"), LuaResponseAction(spoofPolicy))
